<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Choose New Password | JACI</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #f4f7fb;
      color: #111827;
    }

    .page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 30px 20px;
    }

    .card {
      width: 100%;
      max-width: 500px;
      background: #ffffff;
      border-radius: 20px;
      padding: 42px;
      box-shadow: 0 15px 40px rgba(15, 23, 42, 0.10);
    }

    .brand {
      text-align: center;
      margin-bottom: 35px;
    }

    .brand h1 {
      margin: 0;
      font-size: 38px;
    }

    .brand p {
      margin-top: 8px;
      color: #64748b;
      font-size: 16px;
    }

    h2 {
      text-align: center;
      margin-bottom: 10px;
      font-size: 27px;
    }

    .description {
      text-align: center;
      color: #64748b;
      line-height: 1.6;
      margin-bottom: 30px;
    }

    label {
      display: block;
      font-weight: 700;
      margin-bottom: 8px;
    }

    input {
      width: 100%;
      padding: 15px;
      border: 1px solid #cbd5e1;
      border-radius: 10px;
      font-size: 16px;
      margin-bottom: 20px;
    }

    input:focus {
      outline: none;
      border-color: #2563eb;
    }

    button {
      width: 100%;
      border: none;
      border-radius: 10px;
      padding: 16px;
      background: #111827;
      color: #ffffff;
      font-size: 17px;
      font-weight: 700;
      cursor: pointer;
    }

    button:hover {
      background: #1e293b;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    #message {
      margin-top: 20px;
      text-align: center;
      line-height: 1.5;
      font-weight: 600;
    }

    .success {
      color: #15803d;
    }

    .error {
      color: #b91c1c;
    }

    .back {
      margin-top: 28px;
      text-align: center;
    }

    .back a {
      color: #2563eb;
      text-decoration: none;
      font-weight: 700;
    }
  </style>
</head>

<body>

  <main class="page">

    <section class="card">

      <div class="brand">
        <h1>JACI</h1>
        <p>The Home of Knowledge Creators</p>
      </div>

      <h2>Choose a new password</h2>

      <p class="description">
        Create a new password for your JACI account.
      </p>

      <form id="updatePasswordForm">

        <label for="password">New password</label>

        <input
          type="password"
          id="password"
          minlength="8"
          autocomplete="new-password"
          required
          placeholder="Minimum 8 characters"
        >

        <label for="confirmPassword">Confirm new password</label>

        <input
          type="password"
          id="confirmPassword"
          minlength="8"
          autocomplete="new-password"
          required
          placeholder="Repeat your new password"
        >

        <button type="submit" id="updateButton">
          Save new password
        </button>

        <div id="message"></div>

      </form>

      <div class="back">
        <a href="login.html">← Back to JACI Login</a>
      </div>

    </section>

  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>

    const SUPABASE_URL =
      "https://ntdcxhfyghfwdozkykoc.supabase.co";

    const SUPABASE_PUBLISHABLE_KEY =
      "sb_publishable_gUIbtDtYvX3OynDUfRW4tQ_mCTJD_XR";

    const jaciSupabase = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_PUBLISHABLE_KEY
    );

    const updatePasswordForm =
      document.getElementById("updatePasswordForm");

    const passwordInput =
      document.getElementById("password");

    const confirmPasswordInput =
      document.getElementById("confirmPassword");

    const updateButton =
      document.getElementById("updateButton");

    const message =
      document.getElementById("message");


    updatePasswordForm.addEventListener(
      "submit",
      async function(event) {

        event.preventDefault();

        message.textContent = "";
        message.className = "";

        const password = passwordInput.value;
        const confirmPassword = confirmPasswordInput.value;

        if (password.length < 8) {
          message.textContent =
            "Your password must contain at least 8 characters.";
          message.className = "error";
          return;
        }

        if (password !== confirmPassword) {
          message.textContent =
            "The passwords do not match.";
          message.className = "error";
          return;
        }

        updateButton.disabled = true;
        updateButton.textContent = "Saving...";

        try {

          const { error } =
            await jaciSupabase.auth.updateUser({
              password: password
            });

          if (error) {
            throw error;
          }

          message.textContent =
            "Your JACI password has been updated successfully.";

          message.className = "success";

          passwordInput.value = "";
          confirmPasswordInput.value = "";

          setTimeout(function() {
            window.location.href = "login.html";
          }, 1800);

        } catch (error) {

          console.error(error);

          message.textContent =
            "The password could not be updated. Please request a new reset link.";

          message.className = "error";

        } finally {

          updateButton.disabled = false;
          updateButton.textContent = "Save new password";

        }

      }
    );

  </script>

</body>
</html>
